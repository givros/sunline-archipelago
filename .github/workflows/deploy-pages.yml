name: Deploy archipelago to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: artifacts/tropical_archipelago/viewer/package-lock.json

      - name: Restore full-quality scene geometry
        run: python3 scripts/large_assets.py restore --prefix artifacts/tropical_archipelago/viewer/public/

      - name: Install dependencies
        working-directory: artifacts/tropical_archipelago/viewer
        run: npm ci

      - name: Build viewer
        working-directory: artifacts/tropical_archipelago/viewer
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/tropical_archipelago/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
